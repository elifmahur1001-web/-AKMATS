<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMW E30 Drift Simülatörü</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #222;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            pointer-events: none;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e53935;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .drift-score {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(229, 57, 53, 0.85);
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(229,57,53,0.4);
            display: none;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Mobile Controls */
        .controls-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 30px;
        }

        .steering-controls {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .pedal-controls {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .control-btn {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            outline: none;
            transition: background 0.1s, transform 0.1s;
        }

        .control-btn:active, .control-btn.active {
            background: rgba(229, 57, 53, 0.6);
            border-color: #e53935;
            transform: scale(0.92);
        }

        .brake-btn {
            background: rgba(211, 47, 47, 0.3);
            border-color: #f44336;
            width: 75px;
            height: 75px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50%;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .start-screen h1 {
            font-size: 3rem;
            color: #e53935;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(229,57,53,0.5);
        }

        .start-screen p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
            max-width: 500px;
            line-height: 1.5;
        }

        .start-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(229,57,53,0.5);
            transition: 0.2s;
        }

        .start-btn:hover {
            background: #f44336;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="startScreen" class="start-screen">
            <h1>BMW E30 Drift</h1>
            <p>Telefona ve bilgisayara uyumlu haritada yanlama simülatörü. Sol butonlarla yön verin, sağ butonlarla gaz, geri ve el freni (drift) kullanın.</p>
            <button class="start-btn" onclick="startGame()">OYUNA BAŞLA</button>
        </div>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-box" id="speedometer">HIZ: 0 KM/H</div>
        </div>
        <div class="drift-score" id="driftScoreDisplay">DRIFT: 0</div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Touch Controls -->
        <div class="controls-layer">
            <div class="steering-controls">
                <button class="control-btn" id="leftBtn">◀</button>
                <button class="control-btn" id="rightBtn">▶</button>
            </div>
            <div class="pedal-controls">
                <button class="control-btn brake-btn" id="brakeBtn">EL FRENİ</button>
                <button class="control-btn" id="reverseBtn">▼</button>
                <button class="control-btn" id="accelerateBtn">▲</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameStarted = false;

        // Game State & Car Physics
        const car = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            width: 44,
            height: 88,
            angle: 0,
            speed: 0,
            maxSpeed: 12,
            acceleration: 0.2,
            friction: 0.98,
            turnSpeed: 0.045,
            driftFactor: 0.88, // Arkası kayma katsayısı (E30 drift hissi)
            vx: 0,
            vy: 0,
            color: '#e53935'
        };

        const keys = {
            left: false,
            right: false,
            accelerate: false,
            reverse: false,
            brake: false
        };

        // Inputs Setup
        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            
            ['mousedown', 'touchstart'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); });
            });
            ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); });
            });
        }

        setupButton('leftBtn', 'left');
        setupButton('rightBtn', 'right');
        setupButton('accelerateBtn', 'accelerate');
        setupButton('reverseBtn', 'reverse');
        setupButton('brakeBtn', 'brake');

        // Keyboard support for testing on PC
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.accelerate = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.reverse = true;
            if (e.key === ' ' || e.key === 'Shift') keys.brake = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.accelerate = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.reverse = false;
            if (e.key === ' ' || e.key === 'Shift') keys.brake = false;
        });

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameStarted = true;
            requestAnimationFrame(gameLoop);
        }

        // Map Environment (Obstacles / Buildings / Roads)
        const obstacles = [
            { x: 300, y: 200, w: 150, h: 100, color: '#333' },
            { x: 800, y: 150, w: 200, h: 120, color: '#333' },
            { x: 200, y: 600, w: 180, h: 150, color: '#333' },
            { x: 750, y: 550, w: 120, h: 180, color: '#333' },
            { x: 500, y: 350, w: 100, h: 100, color: '#444' } // orta kavşak
        ];

        let particles = [];
        let driftScore = 0;
        let isDrifting = false;

        function update() {
            if (!gameStarted) return;

            // Steering
            let currentTurnSpeed = car.turnSpeed * (car.speed / car.maxSpeed);
            if (keys.left) car.angle -= currentTurnSpeed * (car.speed >= 0 ? 1 : -1);
            if (keys.right) car.angle += currentTurnSpeed * (car.speed >= 0 ? 1 : -1);

            // Acceleration & Braking
            if (keys.accelerate) {
                car.speed += car.acceleration;
                if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
            } else if (keys.reverse) {
                car.speed -= car.acceleration;
                if (car.speed < -car.maxSpeed / 2) car.speed = -car.maxSpeed / 2;
            } else {
                car.speed *= car.friction;
            }

            // Handbrake / Drift Mechanic
            let currentDriftFactor = car.driftFactor;
            if (keys.brake) {
                car.speed *= 0.96; // Yavaşlatma
                currentDriftFactor = 0.96; // Arka tarafı kaydır
                if (Math.abs(car.speed) > 2) {
                    isDrifting = true;
                    driftScore += Math.floor(Math.abs(car.speed));
                    document.getElementById('driftScoreDisplay').style.display = 'block';
                    document.getElementById('driftScoreDisplay').innerText = `DRIFT: ${driftScore}`;
                }
            } else {
                if (isDrifting) {
                    setTimeout(() => { isDrifting = false; document.getElementById('driftScoreDisplay').style.display = 'none'; driftScore = 0; }, 1000);
                }
            }

            // Physics Vector Calculation for Drifting
            const forwardX = Math.sin(car.angle);
            const forwardY = -Math.cos(car.angle);

            // Hedef hız vektörü
            const targetVx = forwardX * car.speed;
            const targetVy = forwardY * car.speed;

            // Kayma (Drift) interpolasyonu
            car.vx = car.vx * currentDriftFactor + targetVx * (1 - currentDriftFactor);
            car.vy = car.vy * currentDriftFactor + targetVy * (1 - currentDriftFactor);

            car.x += car.vx;
            car.y += car.vy;

            // Map Bounds (Sınırlar)
            if (car.x < 50) car.x = 50;
            if (car.x > 3000) car.x = 3000;
            if (car.y < 50) car.y = 50;
            if (car.y > 3000) car.y = 3000;

            // Tire Smoke Particles during drift or high speed turn
            if ((keys.brake || Math.abs(car.vx - targetVx) > 1.5) && Math.abs(car.speed) > 3) {
                particles.push({
                    x: car.x - forwardX * 35,
                    y: car.y - forwardY * 35,
                    alpha: 0.5,
                    size: Math.random() * 8 + 6
                });
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].alpha -= 0.02;
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Speedometer update
            document.getElementById('speedometer').innerText = `HIZ: ${Math.round(Math.abs(car.speed) * 15)} KM/H`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Camera follow (Aracı ortala, harita büyük olsun)
            ctx.save();
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

            // Draw Infinite Asphalt Map Grid / Background
            ctx.fillStyle = '#1b1b1b';
            ctx.fillRect(0, 0, 3050, 3050);

            // Draw Road Lines & Details
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 40;
            ctx.beginPath();
            ctx.moveTo(100, 100); ctx.lineTo(2900, 100);
            ctx.lineTo(2900, 2900); ctx.lineTo(100, 2900);
            ctx.closePath();
            ctx.stroke();

            // Draw Obstacles / Buildings
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Draw Tire Smoke Particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw BMW E30 Car Model (Styled Vector Art representation)
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-car.width/2 - 4, -car.height/2 - 4, car.width + 8, car.height + 8);

            // Wheels
            ctx.fillStyle = '#000';
            ctx.fillRect(-car.width/2 - 6, -car.height/2 + 10, 8, 18); // Ön sol
            ctx.fillRect(car.width/2 - 2, -car.height/2 + 10, 8, 18);  // Ön sağ
            ctx.fillRect(-car.width/2 - 6, car.height/2 - 25, 8, 18);  // Arka sol
            ctx.fillRect(car.width/2 - 2, car.height/2 - 25, 8, 18);   // Arka sağ

            // Car Body (BMW E30 Boxy classic shape)
            ctx.fillStyle = car.color;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);

            // Roof / Cabin
            ctx.fillStyle = '#b71c1c';
            ctx.fillRect(-car.width/2 + 4, -car.height/2 + 25, car.width - 8, 35);

            // Windshields (Front & Rear Glass)
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.width/2 + 6, -car.height/2 + 26, car.width - 12, 12); // Ön cam
            ctx.fillRect(-car.width/2 + 6, -car.height/2 + 50, car.width - 12, 10); // Arka cam

            // Headlights
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(-car.width/2 + 2, -car.height/2, 8, 4);
            ctx.fillRect(car.width/2 - 10, -car.height/2, 8, 4);

            ctx.restore();
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
