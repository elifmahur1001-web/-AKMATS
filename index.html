<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMW E30 Drift Simülatörü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #151515;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #e53935;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
        }

        .drift-score {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(229, 57, 53, 0.9);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }

        .controls-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
        }

        .steering-controls, .pedal-controls {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .control-btn:active, .control-btn.active {
            background: rgba(229, 57, 53, 0.8);
            border-color: #fff;
        }

        .brake-btn {
            background: rgba(211, 47, 47, 0.4);
            border-color: #f44336;
            width: 70px;
            height: 70px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .start-screen h1 {
            font-size: 2.5rem;
            color: #e53935;
            margin-bottom: 15px;
        }

        .start-screen p {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 25px;
            max-width: 400px;
            line-height: 1.4;
        }

        .start-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="startScreen" class="start-screen">
            <h1>BMW E30 DRIFT</h1>
            <p>Telefona ve bilgisayara tam uyumlu drift simülatörü. Sol butonlarla yön verin, sağ butonlarla gaz, geri ve el freni kullanın.</p>
            <button class="start-btn" onclick="startGame()">OYUNA BAŞLA</button> hak ettin!
        </div>

        <div class="hud">
            <div id="speedometer">HIZ: 0 KM/H</div>
        </div>
        <div class="drift-score" id="driftScoreDisplay">DRIFT: 0</div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls-layer">
            <div class="steering-controls">
                <button class="control-btn" id="leftBtn">◀</button>
                <button class="control-btn" id="rightBtn">▶</button>
            </div>
            <div class="pedal-controls">
                <button class="control-btn brake-btn" id="brakeBtn">EL FRENİ</button>
                <button class="control-btn" id="reverseBtn">▼</button>
                <button class="control-btn" id="accelerateBtn">▲</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameStarted = false;

        const car = {
            x: 1500,
            y: 1500,
            width: 40,
            height: 80,
            angle: 0,
            speed: 0,
            maxSpeed: 10,
            accel: 0.2,
            friction: 0.985,
            turnRate: 0.045,
            driftCoeff: 0.85,
            vx: 0,
            vy: 0
        };

        const keys = { left: false, right: false, accelerate: false, reverse: false, brake: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            ['touchstart', 'mousedown'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); keys[key] = true; el.classList.add('active'); }));
            ['touchend', 'mouseup', 'mouseleave', 'touchcancel'].forEach(ev => el.addEventListener(ev, (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); }));
        }

        bindTouch('leftBtn', 'left');
        bindTouch('rightBtn', 'right');
        bindTouch('accelerateBtn', 'accelerate');
        bindTouch('reverseBtn', 'reverse');
        bindTouch('brakeBtn', 'brake');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.accelerate = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.reverse = true;
            if (e.key === ' ' || e.key === 'Shift') keys.brake = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.accelerate = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.reverse = false;
            if (e.key === ' ' || e.key === 'Shift') keys.brake = false;
        });

        function startGame() {
            const screen = document.getElementById('startScreen');
            if(screen) screen.style.display = 'none';
            gameStarted = true;
            requestAnimationFrame(loop);
        }

        // Map setup: Buildings / Obstacles
        const obstacles = [
            {x: 800, y: 800, w: 300, h: 200},
            {x: 1900, y: 700, w: 250, h: 300},
            {x: 1000, y: 2000, w: 350, h: 200},
            {x: 1800, y: 1900, w: 250, h: 250},
            {x: 1400, y: 1300, w: 200, h: 200}
        ];

        let smoke = [];
        let score = 0;
        let drifting = false;

        function update() {
            if (!gameStarted) return;

            let turnMultiplier = car.turnRate * (car.speed / car.maxSpeed);
            if (keys.left) car.angle -= turnMultiplier * (car.speed >= 0 ? 1 : -1);
            if (keys.right) car.angle += turnMultiplier * (car.speed >= 0 ? 1 : -1);

            if (keys.accelerate) {
                car.speed += car.accel;
                if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
            } else if (keys.reverse) {
                car.speed -= car.accel;
                if (car.speed < -car.maxSpeed / 2) car.speed = -car.maxSpeed / 2;
            } else {
                car.speed *= car.friction;
            }

            let currentDrift = car.driftCoeff;
            if (keys.brake) {
                car.speed *= 0.95;
                currentDrift = 0.94; // Kayma hissi
                if (Math.abs(car.speed) > 2) {
                    drifting = true;
                    score += Math.floor(Math.abs(car.speed));
                    const scoreEl = document.getElementById('driftScoreDisplay');
                    scoreEl.style.display = 'block';
                    scoreEl.innerText = `DRIFT: ${score}`;
                }
            } else {
                if (drifting) {
                    setTimeout(() => { drifting = false; document.getElementById('driftScoreDisplay').style.display = 'none'; score = 0; }, 800);
                }
            }

            const fx = Math.sin(car.angle);
            const fy = -Math.cos(car.angle);

            const tx = fx * car.speed;
            const ty = fy * car.speed;

            car.vx = car.vx * currentDrift + tx * (1 - currentDrift);
            car.vy = car.vy * currentDrift + ty * (1 - currentDrift);

            car.x += car.vx;
            car.y += car.vy;

            // Harita sınırları (3000x3000)
            if (car.x < 100) car.x = 100;
            if (car.x > 2900) car.x = 2900;
            if (car.y < 100) car.y = 100;
            if (car.y > 2900) car.y = 2900;

            // Çarpışma kontrolü (Binalar)
            obstacles.forEach(obs => {
                if (car.x > obs.x && car.x < obs.x + obs.w && car.y > obs.y && car.y < obs.y + obs.h) {
                    car.speed = -car.speed * 0.4;
                }
            });

            // Lastik dumanı
            if ((keys.brake || Math.abs(car.vx - tx) > 1.2) && Math.abs(car.speed) > 2.5) {
                smoke.push({ x: car.x - fx * 30, y: car.y - fy * 30, alpha: 0.4, size: Math.random() * 6 + 4 });
            }

            for (let i = smoke.length - 1; i >= 0; i--) {
                smoke[i].alpha -= 0.03;
                if (smoke[i].alpha <= 0) smoke.splice(i, 1);
            }

            document.getElementById('speedometer').innerText = `HIZ: ${Math.round(Math.abs(car.speed) * 15)} KM/H`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

            // Zemin (Asfalt)
            ctx.fillStyle = '#1c1c1c';
            ctx.fillRect(0, 0, 3000, 3000);

            // Yol Izgaraları / Çizgiler
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 50;
            ctx.beginPath();
            ctx.moveTo(200, 200); ctx.lineTo(2800, 200);
            ctx.lineTo(2800, 2800); ctx.lineTo(200, 2800);
            ctx.closePath();
            ctx.stroke();

            // Binalar
            obstacles.forEach(obs => {
                ctx.fillStyle = '#2b2b2b';
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 3;
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Dumanlar
            smoke.forEach(s => {
                ctx.fillStyle = `rgba(180, 180, 180, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // BMW E30 Çizimi
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            // Gölge
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(-car.width/2 - 3, -car.height/2 - 3, car.width + 6, car.height + 6);

            // Tekerlekler
            ctx.fillStyle = '#050505';
            ctx.fillRect(-car.width/2 - 5, -car.height/2 + 8, 6, 16);
            ctx.fillRect(car.width/2 - 1, -car.height/2 + 8, 6, 16);
            ctx.fillRect(-car.width/2 - 5, car.height/2 - 20, 6, 16);
            ctx.fillRect(car.width/2 - 1, car.height/2 - 20, 6, 16);

            // Gövde (Kırmızı E30)
            ctx.fillStyle = '#d32f2f';
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);

            // Kabin / Tavan
            ctx.fillStyle = '#9a0007';
            ctx.fillRect(-car.width/2 + 4, -car.height/2 + 22, car.width - 8, 34);

            // Camlar
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.width/2 + 6, -car.height/2 + 24, car.width - 12, 11);
            ctx.fillRect(-car.width/2 + 6, -car.height/2 + 45, car.width - 12, 9);

            // Farlar
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(-car.width/2 + 2, -car.height/2, 6, 3);
            ctx.fillRect(car.width/2 - 8, -car.height/2, 6, 3);

            ctx.restore();
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            if(gameStarted) requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
