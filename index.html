<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Drive V5.1 - Ses Yolu Düzeltildi</title>
<style>
:root{
  --bg:#08111f;
  --panel:#101c2f;
  --line:#27415f;
  --text:#eaf2ff;
  --muted:#91a7c0;
  --cyan:#32d8ff;
  --green:#37e38b;
  --red:#ff5b6e;
  --amber:#ffc857;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
body{touch-action:none}
#gameWrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;background:#132338}
.topbar{
  position:absolute;left:10px;right:10px;top:10px;display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;z-index:5
}
.gauge{
  background:rgba(6,14,25,.82);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.25)
}
.gauge .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.gauge .value{font-size:22px;font-weight:800;margin-top:2px}
#speedVal{color:var(--cyan)}
#gearVal{color:var(--amber)}
#rpmVal{color:var(--green)}
#boostVal{color:#d78cff}
.boostBar{
  height:6px;background:#1b2d46;border-radius:999px;overflow:hidden;margin-top:6px
}
.boostFill{height:100%;width:0;background:linear-gradient(90deg,#32d8ff,#d78cff)}
.centerMsg{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  background:rgba(5,12,22,.86);border:1px solid rgba(255,255,255,.15);
  border-radius:18px;padding:18px 20px;text-align:center;z-index:7;max-width:340px;
  box-shadow:0 20px 50px rgba(0,0,0,.42)
}
.centerMsg h1{font-size:27px;margin:0 0 8px}
.centerMsg p{font-size:14px;color:#b7c8dc;margin:0 0 14px;line-height:1.45}
.primaryBtn{
  border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,#26d6ff,#2d8cff);color:white;min-width:160px
}
.smallNote{margin-top:10px;font-size:11px;color:#8296ad}
.controls{position:absolute;left:0;right:0;bottom:10px;z-index:6;pointer-events:none}
.steerGroup{position:absolute;left:12px;bottom:0;display:flex;gap:10px;pointer-events:auto}
.pedalGroup{position:absolute;right:12px;bottom:0;display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.ctrl{
  border:1px solid rgba(255,255,255,.16);background:rgba(8,18,31,.82);color:white;
  border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;
  user-select:none;backdrop-filter:blur(8px);box-shadow:0 10px 28px rgba(0,0,0,.3)
}
.ctrl:active,.ctrl.active{transform:scale(.96);filter:brightness(1.25)}
.steer{width:74px;height:74px;font-size:32px}
.pedal{width:84px;height:112px;flex-direction:column;font-size:15px}
.pedal span{font-size:28px;margin-bottom:4px}
.gas{border-color:rgba(55,227,139,.5);color:#7cffbd}
.brake{border-color:rgba(255,91,110,.5);color:#ff9dab}
.soundBtn{
  position:absolute;right:12px;top:96px;z-index:6;border:1px solid rgba(255,255,255,.15);
  background:rgba(6,14,25,.82);color:white;border-radius:12px;padding:10px 12px;font-weight:700
}
.help{
  position:absolute;left:12px;top:96px;z-index:6;font-size:12px;color:#c7d7ea;
  background:rgba(6,14,25,.72);border:1px solid rgba(255,255,255,.1);
  padding:8px 10px;border-radius:10px
}
@media(max-width:700px){
  .topbar{grid-template-columns:repeat(2,minmax(0,1fr));max-width:340px}
  .soundBtn,.help{top:160px}
  .gauge .value{font-size:19px}
  .steer{width:66px;height:66px}
  .pedal{width:76px;height:104px}
}
@media(max-height:620px){
  .pedal{height:90px}
  .steer{width:60px;height:60px}
  .soundBtn,.help{display:none}
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div class="topbar">
    <div class="gauge"><div class="label">Hız</div><div class="value"><span id="speedVal">0</span> km/s</div></div>
    <div class="gauge"><div class="label">Otomatik Vites</div><div class="value" id="gearVal">N</div></div>
    <div class="gauge"><div class="label">Devir</div><div class="value"><span id="rpmVal">900</span> rpm</div></div>
    <div class="gauge"><div class="label">Turbo</div><div class="value"><span id="boostVal">0.0</span> bar</div><div class="boostBar"><div class="boostFill" id="boostFill"></div></div></div>
  </div>

  <button class="soundBtn" id="soundBtn">🔊 Gerçek Ses Açık</button>
  <div class="help" id="audioStatus">Ses durumu: Hazır değil</div>

  <div class="centerMsg" id="startBox">
    <h1>TURBO DRIVE V5.1</h1>
    <p>Yüklediğin gerçek motor kaydı, devirli otomatik vites ve sabit ekranla sürüşe başla.</p>
    <button class="primaryBtn" id="startBtn">MOTORU ÇALIŞTIR</button>
    <div class="smallNote">Sesler tamamen bu klasördeki kayıt dosyalarından gelir; internet gerekmez.</div>
  </div>

  <div class="controls">
    <div class="steerGroup">
      <div class="ctrl steer" id="leftBtn">◀</div>
      <div class="ctrl steer" id="rightBtn">▶</div>
    </div>
    <div class="pedalGroup">
      <div class="ctrl pedal brake" id="brakeBtn"><span>⏹</span>FREN</div>
      <div class="ctrl pedal gas" id="gasBtn"><span>▲</span>GAZ</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const speedEl = document.getElementById('speedVal');
const gearEl = document.getElementById('gearVal');
const rpmEl = document.getElementById('rpmVal');
const boostEl = document.getElementById('boostVal');
const boostFill = document.getElementById('boostFill');
const startBox = document.getElementById('startBox');
const startBtn = document.getElementById('startBtn');
const soundBtn = document.getElementById('soundBtn');
const audioStatus = document.getElementById('audioStatus');

let W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
function resize(){
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize);
resize();

const input = {left:false,right:false,gas:false,brake:false};
let running = false;
let last = performance.now();
let roadOffset = 0;
let speed = 0;
let gear = 1;
let rpm = 900;
let boost = 0;
let score = 0;
let playerX = 0;
let shake = 0;
let shiftFlash = 0;
let traffic = [];
let spawnTimer = 0;

function laneCenter(lane){
  const roadW = Math.min(W*0.72, 560);
  const left = W/2-roadW/2;
  return left + roadW*(lane+0.5)/3;
}
playerX = laneCenter(1);

function resetGame(){
  speed = 0; gear = 1; rpm = 900; boost = 0; score = 0;
  traffic = []; spawnTimer = 0; playerX = laneCenter(1);
}

function roundedRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}

function drawCar(x,y,w,h,color,player=false){
  ctx.save();
  if(player && shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.translate(x,y);

  // Yol üzerindeki yumuşak gölge
  const shadow = ctx.createRadialGradient(0,h*.34,w*.08,0,h*.34,w*.72);
  shadow.addColorStop(0,'rgba(0,0,0,.52)');
  shadow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shadow;
  ctx.beginPath();
  ctx.ellipse(0,h*.34,w*.72,h*.22,0,0,Math.PI*2);
  ctx.fill();

  // Lastikler ve jantlar
  const wheelY=[-h*.25,h*.20];
  for(const wy of wheelY){
    for(const sx of [-1,1]){
      ctx.fillStyle='#05080c';
      roundedRect(sx*w*.43-w*.09,wy-h*.14,w*.18,h*.28,w*.06,'#05080c');
      ctx.fillStyle='#9aa6b2';
      ctx.beginPath();
      ctx.arc(sx*w*.43,wy,w*.075,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#29323b';
      ctx.beginPath();
      ctx.arc(sx*w*.43,wy,w*.038,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Gövde dış çizgisi
  ctx.beginPath();
  ctx.moveTo(-w*.34,-h*.49);
  ctx.quadraticCurveTo(-w*.46,-h*.43,-w*.47,-h*.25);
  ctx.lineTo(-w*.49,h*.22);
  ctx.quadraticCurveTo(-w*.45,h*.46,-w*.28,h*.50);
  ctx.lineTo(w*.28,h*.50);
  ctx.quadraticCurveTo(w*.45,h*.46,w*.49,h*.22);
  ctx.lineTo(w*.47,-h*.25);
  ctx.quadraticCurveTo(w*.46,-h*.43,w*.34,-h*.49);
  ctx.closePath();

  const bodyGrad=ctx.createLinearGradient(-w*.5,0,w*.5,0);
  bodyGrad.addColorStop(0,'#0a3f70');
  bodyGrad.addColorStop(.18,color);
  bodyGrad.addColorStop(.5,player?'#4dc8ff':color);
  bodyGrad.addColorStop(.82,color);
  bodyGrad.addColorStop(1,'#072f55');
  ctx.fillStyle=bodyGrad;
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.22)';
  ctx.lineWidth=1.2;
  ctx.stroke();

  // Kaput
  const hoodGrad=ctx.createLinearGradient(0,-h*.48,0,-h*.12);
  hoodGrad.addColorStop(0,'rgba(255,255,255,.18)');
  hoodGrad.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=hoodGrad;
  ctx.beginPath();
  ctx.moveTo(-w*.29,-h*.46);
  ctx.lineTo(w*.29,-h*.46);
  ctx.lineTo(w*.34,-h*.15);
  ctx.lineTo(-w*.34,-h*.15);
  ctx.closePath();
  ctx.fill();

  // Ön cam
  const glass=ctx.createLinearGradient(0,-h*.18,0,h*.18);
  glass.addColorStop(0,'#79b8d8');
  glass.addColorStop(.45,'#1a3c52');
  glass.addColorStop(1,'#0d2637');
  ctx.fillStyle=glass;
  ctx.beginPath();
  ctx.moveTo(-w*.30,-h*.16);
  ctx.lineTo(w*.30,-h*.16);
  ctx.lineTo(w*.26,h*.03);
  ctx.lineTo(-w*.26,h*.03);
  ctx.closePath();
  ctx.fill();

  // Tavan
  const roofGrad=ctx.createLinearGradient(-w*.25,0,w*.25,0);
  roofGrad.addColorStop(0,'#0d5b96');
  roofGrad.addColorStop(.5,'#58cfff');
  roofGrad.addColorStop(1,'#0b4e82');
  ctx.fillStyle=roofGrad;
  roundedRect(-w*.27,-h*.02,w*.54,h*.24,w*.08,roofGrad);

  // Arka cam
  ctx.fillStyle='#102d40';
  ctx.beginPath();
  ctx.moveTo(-w*.26,h*.20);
  ctx.lineTo(w*.26,h*.20);
  ctx.lineTo(w*.31,h*.34);
  ctx.lineTo(-w*.31,h*.34);
  ctx.closePath();
  ctx.fill();

  // Kapı çizgileri
  ctx.strokeStyle='rgba(0,0,0,.34)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-w*.34,-h*.07); ctx.lineTo(-w*.36,h*.30);
  ctx.moveTo(w*.34,-h*.07); ctx.lineTo(w*.36,h*.30);
  ctx.moveTo(0,-h*.04); ctx.lineTo(0,h*.28);
  ctx.stroke();

  // Yan aynalar
  ctx.fillStyle='#0a365d';
  roundedRect(-w*.54,-h*.06,w*.12,h*.10,w*.03,'#0a365d');
  roundedRect(w*.42,-h*.06,w*.12,h*.10,w*.03,'#0a365d');

  // Ön farlar
  const headGlow=player?'#d8fbff':'#fff2a6';
  ctx.fillStyle=headGlow;
  roundedRect(-w*.31,-h*.48,w*.20,h*.07,w*.02,headGlow);
  roundedRect(w*.11,-h*.48,w*.20,h*.07,w*.02,headGlow);

  // Izgara
  ctx.fillStyle='#080d12';
  roundedRect(-w*.10,-h*.49,w*.08,h*.08,w*.015,'#080d12');
  roundedRect(w*.02,-h*.49,w*.08,h*.08,w*.015,'#080d12');

  // Stop lambaları
  ctx.fillStyle='#ff334f';
  roundedRect(-w*.31,h*.43,w*.20,h*.06,w*.02,'#ff334f');
  roundedRect(w*.11,h*.43,w*.20,h*.06,w*.02,'#ff334f');

  // Plaka
  ctx.fillStyle='#e9eef3';
  roundedRect(-w*.12,h*.445,w*.24,h*.035,w*.008,'#e9eef3');
  ctx.fillStyle='#17202a';
  ctx.font=`bold ${Math.max(5,w*.07)}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(player?'CHN 001':'34 AI',0,h*.462);

  // Egzoz ucu
  ctx.fillStyle='#111820';
  ctx.beginPath();
  ctx.arc(w*.23,h*.51,w*.045,0,Math.PI*2);
  ctx.fill();

  // Turbo alevi
  if(player && boost>.25){
    const flame = 7 + boost*22 + Math.random()*9;
    const flameGrad=ctx.createLinearGradient(0,h*.50,0,h*.50+flame);
    flameGrad.addColorStop(0,'#ffffff');
    flameGrad.addColorStop(.25,'#6ee7ff');
    flameGrad.addColorStop(.65,'#7d5cff');
    flameGrad.addColorStop(1,'rgba(125,92,255,0)');
    ctx.fillStyle=flameGrad;
    ctx.beginPath();
    ctx.moveTo(w*.18,h*.50);
    ctx.quadraticCurveTo(w*.23,h*.50+flame*.75,w*.27,h*.50);
    ctx.closePath();
    ctx.fill();
  }

  // Gövde yansıması
  ctx.strokeStyle='rgba(255,255,255,.28)';
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(-w*.20,-h*.42);
  ctx.quadraticCurveTo(0,-h*.47,w*.18,-h*.40);
  ctx.stroke();

  ctx.restore();
}
function drawScene(){
  ctx.clearRect(0,0,W,H);

  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0e2740');
  sky.addColorStop(.6,'#274763');
  sky.addColorStop(1,'#182a20');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#0d1b16';
  ctx.beginPath();
  ctx.moveTo(0,H*.25);
  for(let x=0;x<=W;x+=60){
    ctx.lineTo(x,H*.22+Math.sin(x*.03)*18);
  }
  ctx.lineTo(W,H*.55);ctx.lineTo(0,H*.55);ctx.fill();

  const roadW = Math.min(W*.72,560);
  const left = W/2-roadW/2;
  ctx.fillStyle='#28323b';
  ctx.fillRect(left,0,roadW,H);

  ctx.fillStyle='#929da6';
  ctx.fillRect(left-8,0,8,H);
  ctx.fillRect(left+roadW,0,8,H);

  ctx.strokeStyle='rgba(255,255,255,.85)';
  ctx.lineWidth=4;
  ctx.setLineDash([36,32]);
  ctx.lineDashOffset=roadOffset;
  for(let i=1;i<3;i++){
    const x=left+roadW*i/3;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.fillStyle='#314d33';
  ctx.fillRect(0,0,left-8,H);
  ctx.fillRect(left+roadW+8,0,W-(left+roadW+8),H);

  for(let y=(roadOffset*1.4)%90-90;y<H;y+=90){
    ctx.fillStyle='#d3d7d9';
    ctx.fillRect(left-18,y,6,34);
    ctx.fillRect(left+roadW+12,y,6,34);
  }

  for(const c of traffic) drawCar(c.x,c.y,c.w,c.h,c.color,false);

  const pw = Math.max(42,Math.min(58,W*.11));
  const ph = pw*1.7;
  drawCar(playerX,H-ph*.78,pw,ph,'#1aa6ff',true);

  if(shiftFlash>0){
    ctx.fillStyle=`rgba(255,200,87,${shiftFlash})`;
    ctx.font='bold 28px Arial';
    ctx.textAlign='center';
    ctx.fillText('VİTES YÜKSELDİ',W/2,H*.33);
  }

  ctx.textAlign='left';
}


const idleAudio = new Audio('./idle.mp3');
const accelAudio = new Audio('./acceleration.mp3');
const highAudio = new Audio('./high_rev.mp3');

idleAudio.loop = true;
accelAudio.loop = true;
highAudio.loop = true;
idleAudio.preload = accelAudio.preload = highAudio.preload = 'auto';


[idleAudio, accelAudio, highAudio].forEach((audio, index)=>{
  const names = ['idle.mp3','acceleration.mp3','high_rev.mp3'];
  audio.addEventListener('error', ()=>{
    audioStatus.textContent = 'Bulunamadı: ' + names[index];
  });
  audio.addEventListener('canplaythrough', ()=>{
    if(!audioStarted) audioStatus.textContent = 'Ses dosyaları yüklendi';
  });
});

let soundOn = true;
let audioStarted = false;
let lastGas = false;

async function initAudio(){
  // iPhone Safari için tüm sesler doğrudan kullanıcı dokunuşunda açılır.
  if(audioStarted) return true;

  idleAudio.volume = 0.55;
  accelAudio.volume = 0;
  highAudio.volume = 0;

  idleAudio.playbackRate = 0.92;
  accelAudio.playbackRate = 0.82;
  highAudio.playbackRate = 0.86;

  try{
    idleAudio.currentTime = 0;
    accelAudio.currentTime = 0;
    highAudio.currentTime = 0;

    const results = await Promise.allSettled([
      idleAudio.play(),
      accelAudio.play(),
      highAudio.play()
    ]);

    const ok = results.some(r => r.status === 'fulfilled');
    audioStarted = ok;

    if(ok){
      audioStatus.textContent = 'Ses durumu: Gerçek motor sesi aktif';
      return true;
    }

    audioStatus.textContent = 'Ses hatası: MP3 dosyaları açılamadı';
    return false;
  }catch(err){
    audioStatus.textContent = 'Ses hatası: ' + (err.name || 'Bilinmeyen hata');
    return false;
  }
}

function blowoffSound(){
  // Kullanıcının yüklediği kayıtta ayrı turbo tahliye sesi olmadığı için
  // rastgele veya yapay tahliye sesi çalınmıyor.
}

function shiftSound(){
  // Vites geçişinde kayıtlar kısa süreli kısılır; rastgele efekt eklenmez.
}

function updateAudio(){
  if(!audioStarted) return;

  const enabled = running && soundOn;
  if(!enabled){
    idleAudio.volume = 0;
    accelAudio.volume = 0;
    highAudio.volume = 0;
    return;
  }

  const rpmNorm = Math.max(0, Math.min(1, (rpm - 850) / 6150));
  const throttle = input.gas ? 1 : 0;

  idleAudio.playbackRate = 0.90 + rpmNorm * 0.22;
  accelAudio.playbackRate = 0.78 + rpmNorm * 0.55;
  highAudio.playbackRate = 0.82 + rpmNorm * 0.52;

  const idleTarget = throttle ? Math.max(0.05, 0.35 - rpmNorm * 0.28) : 0.52;
  const accelTarget = throttle ? Math.min(0.70, 0.16 + rpmNorm * 0.62) : 0.03;
  const highTarget = throttle && rpmNorm > 0.67
    ? Math.min(0.62, (rpmNorm - 0.67) * 1.85)
    : 0;

  idleAudio.volume += (idleTarget - idleAudio.volume) * 0.12;
  accelAudio.volume += (accelTarget - accelAudio.volume) * 0.14;
  highAudio.volume += (highTarget - highAudio.volume) * 0.16;

  lastGas = input.gas;
}

function bindHold(el,key){
  const on=e=>{e.preventDefault();input[key]=true;el.classList.add('active')};
  const off=e=>{e.preventDefault();input[key]=false;el.classList.remove('active')};
  el.addEventListener('pointerdown',on);
  addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
}
bindHold(document.getElementById('leftBtn'),'left');
bindHold(document.getElementById('rightBtn'),'right');
bindHold(document.getElementById('gasBtn'),'gas');
bindHold(document.getElementById('brakeBtn'),'brake');

addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) input.left=true;
  if(['ArrowRight','d','D'].includes(e.key)) input.right=true;
  if(['ArrowUp','w','W'].includes(e.key)) input.gas=true;
  if(['ArrowDown','s','S'].includes(e.key)) input.brake=true;
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) input.left=false;
  if(['ArrowRight','d','D'].includes(e.key)) input.right=false;
  if(['ArrowUp','w','W'].includes(e.key)) input.gas=false;
  if(['ArrowDown','s','S'].includes(e.key)) input.brake=false;
});

startBtn.addEventListener('click', async()=>{
  resetGame();

  const audioOk = await initAudio();

  running = true;
  startBox.style.display = 'none';

  if(!audioOk){
    soundBtn.textContent = '⚠️ Ses Dosyası Bulunamadı';
  }
});

soundBtn.addEventListener('click', async()=>{
  if(!audioStarted){
    const ok = await initAudio();
    if(!ok) return;
  }

  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊 Gerçek Ses Açık' : '🔇 Ses Kapalı';

  if(soundOn){
    await Promise.allSettled([
      idleAudio.play(),
      accelAudio.play(),
      highAudio.play()
    ]);
    audioStatus.textContent = 'Ses durumu: Gerçek motor sesi aktif';
  }else{
    idleAudio.volume = 0;
    accelAudio.volume = 0;
    highAudio.volume = 0;
    audioStatus.textContent = 'Ses durumu: Kapalı';
  }
});

function spawnTraffic(){
  const lane=Math.floor(Math.random()*3);
  const colors=['#ff4c5b','#ffd34d','#8b6cff','#36d68a','#f2f2f2'];
  const w=Math.max(38,Math.min(52,W*.09));
  traffic.push({
    x:laneCenter(lane),y:-120,w,h:w*1.7,
    speed:50+Math.random()*90,
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}

function update(dt){
  if(!running) return;

  const rpmPower = 1 - Math.max(0,(rpm-6200)/1800);
  const accel = input.gas ? (36 + boost*30) * Math.max(.45,rpmPower) : -9;
  speed += accel*dt;
  if(input.brake) speed -= 95*dt;
  speed = Math.max(0,Math.min(240,speed));

  const ratios=[0,3.55,2.25,1.62,1.24,.98,.80];
  const oldGear=gear;

  // Devir tabanlı tam otomatik şanzıman.
  let calculatedRpm = 900 + speed*ratios[gear]*34;

  // Tam gazda 6.700 devir civarında, hafif gazda daha erken vites büyütür.
  const upshiftRpm = input.gas ? 6700 : 4700;
  const downshiftRpm = input.gas ? 2350 : 1650;

  if(calculatedRpm >= upshiftRpm && gear < 6){
    gear++;
    calculatedRpm = 900 + speed*ratios[gear]*34;
  } else if(calculatedRpm <= downshiftRpm && gear > 1){
    gear--;
    calculatedRpm = 900 + speed*ratios[gear]*34;
  }

  if(gear!==oldGear){
    shiftFlash=1;
    if(audioStarted && soundOn){
      const a = accelAudio.volume;
      const h = highAudio.volume;
      accelAudio.volume = Math.max(0, a * 0.32);
      highAudio.volume = Math.max(0, h * 0.18);
      setTimeout(()=>{
        if(soundOn){
          accelAudio.volume = Math.min(0.7, a);
          highAudio.volume = Math.min(0.62, h);
        }
      }, 170);
    }
  }

  rpm += (calculatedRpm-rpm)*Math.min(1,dt*8);
  rpm = Math.max(850,Math.min(7000,rpm));

  const targetBoost = input.gas && rpm>2100 ? Math.min(1.5,(rpm-2100)/3000*1.5) : 0;
  boost += (targetBoost-boost)*Math.min(1,dt*(input.gas?2.5:5.5));

  const steerSpeed=(115+speed*.7)*dt;
  if(input.left) playerX-=steerSpeed;
  if(input.right) playerX+=steerSpeed;

  const roadW=Math.min(W*.72,560), left=W/2-roadW/2;
  const pw=Math.max(42,Math.min(58,W*.11));
  playerX=Math.max(left+pw*.55,Math.min(left+roadW-pw*.55,playerX));

  roadOffset += speed*dt*1.8;
  shiftFlash=Math.max(0,shiftFlash-dt*2.2);
  shake=Math.max(0,shake-dt*8);

  spawnTimer-=dt;
  if(spawnTimer<=0 && speed>20){
    spawnTraffic();
    spawnTimer=Math.max(.55,1.55-speed/260);
  }

  const playerY=H-(pw*1.7)*.78;
  for(let i=traffic.length-1;i>=0;i--){
    const c=traffic[i];
    c.y += (speed-c.speed)*dt*1.15 + 45*dt;
    if(c.y>H+160){
      traffic.splice(i,1);
      score++;
      continue;
    }
    const overlapX=Math.abs(c.x-playerX)<(c.w+pw)*.42;
    const overlapY=Math.abs(c.y-playerY)<(c.h+pw*1.7)*.38;
    if(overlapX&&overlapY){
      speed*=.35;
      shake=8;
      c.y-=40;
    }
  }

  speedEl.textContent=Math.round(speed);
  gearEl.textContent=speed<1?'N':'D'+gear;
  rpmEl.textContent=Math.round(rpm/50)*50;
  boostEl.textContent=boost.toFixed(1);
  boostFill.style.width=Math.min(100,boost/1.5*100)+'%';

  updateAudio();
}

function loop(t){
  const dt=Math.min(.033,(t-last)/1000);
  last=t;
  update(dt);
  drawScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// iPhone/Safari yakınlaştırma, çift dokunma ve jest engelleme
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});

let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

document.addEventListener('touchmove', e => {
  if (e.scale && e.scale !== 1) e.preventDefault();
}, {passive:false});

</script>
